<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amethyst - CORET Foundation Nigeria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="logo-section">
                <h1>⚜️ AMETHYST</h1>
                <p class="tagline">Digital Infrastructure for CORET Foundation Nigeria</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-form active">
                <h2>Welcome Back</h2>
                <form id="login">
                    <input type="email" id="loginEmail" placeholder="Email Address" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <p class="switch">Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="auth-form">
                <h2>Join CORET</h2>
                <form id="signup">
                    <input type="text" id="signupFullname" placeholder="Full Name" required>
                    <input type="email" id="signupEmail" placeholder="Email Address" required>
                    <select id="signupZone" required>
                        <option value="">Select Geopolitical Zone</option>
                        <option value="North-Central">North-Central</option>
                        <option value="North-East">North-East</option>
                        <option value="North-West">North-West</option>
                        <option value="South-East">South-East</option>
                        <option value="South-South">South-South</option>
                        <option value="South-West">South-West</option>
                    </select>
                    <select id="signupGender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Non-binary">Non-binary</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <button type="submit">Create Account</button>
                </form>
                <p class="switch">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
