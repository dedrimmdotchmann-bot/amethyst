<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Users to Amethyst</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><div style="background:white;padding:10px 20px;text-align:center;border-bottom:1px solid #e2e8f0;"><a href="../index.html" style="margin:0 10px;color:#667eea;">?? Home</a> | <a href="../about.html" style="margin:0 10px;color:#667eea;">?? About</a> | <a href="../dashboard.html" style="margin:0 10px;color:#667eea;">?? Dashboard</a> | <a href="../groups.html" style="margin:0 10px;color:#667eea;">?? Groups</a> | <a href="import-users.html" style="margin:0 10px;color:#667eea;">?? Import</a></div>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>📊 Import Users to Amethyst</h2>
                <p>Import users → Auto-create accounts → Copy credentials to send emails</p>
            </div>
            <div class="card-body">
                <!-- Email Configuration -->
                <div class="email-config">
                    <h3>📧 Gmail Settings</h3>
                    <label>Your Gmail Address:</label>
                    <input type="email" id="fromEmail" value="dedrimmdotchmann@gmail.com">
                    
                    <label>Gmail App Password:</label>
                    <input type="password" id="smtpPassword" value="kqukqeqxzhzvzqnt">
                    
                    <label>WhatsApp Group Link:</label>
                    <input type="text" id="whatsappLink" value="https://chat.whatsapp.com/HcqS9j2RZHnA6xOyBJi6Bq?mode=gi_t">
                    
                    <small>✅ Using your Gmail with App Password</small>
                </div>

                <!-- Actions Section -->
                <div class="email-config" style="margin-top:20px;">
                    <h3>🔄 Actions</h3>
                    <button class="btn" onclick="copyAllManual()" style="background:#667eea;">📋 Copy All Credentials</button>
                    <button class="btn" onclick="viewFailedEmails()" style="background:#e2e8f0;">📋 View Failed List</button>
                </div>

                <!-- Preview Section -->
                <div id="step1">
                    <div class="alert alert-info">
                        <strong>📋 Ready:</strong> 9 users will be imported!
                    </div>
                    
                    <div style="overflow-x: auto;">
                        <table id="previewTable">
                            <thead>
                                <tr><th>#</th><th>Email</th><th>Name</th><th>Worldview</th><th>Status</th></tr>
                            </thead>
                            <tbody id="previewBody"></tbody>
                        </table>
                    </div>
                    
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-success" onclick="importUsers()">✅ Import & Create Accounts</button>
                        <button class="btn btn-danger" onclick="clearAllUsers()">🗑️ Clear All Users</button>
                    </div>
                </div>

                <!-- Results Section -->
                <div id="step2" class="hidden">
                    <div class="progress-bar" id="progressBar">0%</div>
                    <div id="results"></div>
                    <button class="btn btn-secondary" onclick="location.reload()">↺ Done</button>
                </div>
            </div>
        </div>
    </div>

    <script src="users-data.js"></script>
    <script>
    // ============================================
    // MAIN APPLICATION CODE
    // ============================================
    
    let importResults = [];
    let emailResults = [];

    // Display preview table
    function displayPreview() {
        const tbody = document.getElementById('previewBody');
        const existing = JSON.parse(localStorage.getItem('amethyst_members') || '[]');
        
        tbody.innerHTML = usersData.map((user, i) => {
            const exists = existing.some(m => m.email === user.email);
            const status = exists ? '⚠️ Already Exists' : '✅ Ready';
            const bgColor = exists ? '#fef3c7' : '#e6f7e6';
            return `<tr style="background:${bgColor}">
                <td>${i + 1}</td>
                <td>${user.email}</td>
                <td><strong>${user.fullName}</strong></td>
                <td>${user.worldview}</td>
                <td><span class="status-badge ${exists ? 'status-pending' : 'status-success'}">${status}</span></td>
            </tr>`;
        }).join('');
    }

    // Import users
    async function importUsers() {
        const existing = JSON.parse(localStorage.getItem('amethyst_members') || '[]');
        const newUsers = usersData.filter(u => !existing.some(m => m.email === u.email));
        
        if (newUsers.length === 0) {
            alert('All users already exist!');
            return;
        }
        
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').classList.remove('hidden');
        
        const progressBar = document.getElementById('progressBar');
        importResults = [];
        
        for (let i = 0; i < newUsers.length; i++) {
            const user = newUsers[i];
            const percent = Math.round(((i + 1) / newUsers.length) * 100);
            
            progressBar.style.width = `${percent}%`;
            progressBar.textContent = `${percent}% - Importing ${user.fullName}...`;
            
            // Create member object
            const newMember = {
                id: `IMPORTED_${Date.now()}_${i}`,
                email: user.email,
                fullName: user.fullName,
                phone: user.phone,
                worldview: user.worldview,
                zone: user.zone,
                password: user.password,
                registrationDate: new Date().toISOString(),
                status: 'active',
                role: 'member'
            };
            
            existing.push(newMember);
            
            importResults.push({
                fullName: user.fullName,
                email: user.email,
                password: user.password
            });
            
            await new Promise(resolve => setTimeout(resolve, 200));
        }
        
        // Save to localStorage
        localStorage.setItem('amethyst_members', JSON.stringify(existing));
        
        // Add admin if missing
        if (!existing.some(m => m.email === 'admin@amethyst.ng')) {
            existing.push({
                id: 'admin_001',
                fullName: 'System Administrator',
                email: 'admin@amethyst.ng',
                password: 'admin123',
                role: 'admin',
                status: 'active',
                registrationDate: new Date().toISOString()
            });
            localStorage.setItem('amethyst_members', JSON.stringify(existing));
        }
        
        displayResults();
    }
    
    function displayResults() {
        const resultsDiv = document.getElementById('results');
        
        let html = `<div class="alert alert-success">✅ Successfully imported ${importResults.length} users!</div>`;
        html += '<div style="overflow-x: auto; max-height: 400px;"><table style="width:100%; font-size:12px;">';
        html += '<thead><tr><th>#</th><th>Name</th><th>Email</th><th>Password</th></tr></thead><tbody>';
        
        importResults.forEach((result, index) => {
            html += `<tr>
                <td>${index + 1}</td>
                <td><strong>${escapeHtml(result.fullName)}</strong></td>
                <td>${escapeHtml(result.email)}</td>
                <td><code style="background:#e2e8f0;padding:4px 8px;">${result.password}</code></td>
            </tr>`;
        });
        
        html += '</tbody></table></div>';
        
        html += `<div class="credentials-box">
            <strong>📊 IMPORT COMPLETE!</strong><br>
            ✅ Users created: ${importResults.length}<br>
            <br>
            <strong>📧 TO SEND EMAILS:</strong><br>
            1. Click the "Copy All Credentials" button below<br>
            2. Open Gmail → Compose<br>
            3. Paste the credentials and send to users<br>
            <br>
            <strong>👑 Admin Login:</strong> admin@amethyst.ng / admin123<br>
            <strong>💡 WhatsApp Group:</strong> ${document.getElementById('whatsappLink')?.value}<br>
            <br>
            <button class="copy-btn" onclick="copyAllManual()">📋 Copy All Credentials</button>
            <button class="copy-btn" onclick="copyEmailsOnly()">📧 Copy Emails Only</button>
        </div>`;
        
        resultsDiv.innerHTML = html;
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('progressBar').textContent = 'Complete!';
    }
    
    function copyAllManual() {
        let text = "🔐 CORET FOUNDATION - AMETHYST LOGIN CREDENTIALS\n";
        text += "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n";
        text += "🌍 WhatsApp Group: https://chat.whatsapp.com/HcqS9j2RZHnA6xOyBJi6Bq\n";
        text += "🔗 Login Portal: https://amethyst.coret.ng\n\n";
        
        importResults.forEach(r => {
            text += `👤 ${r.fullName}\n`;
            text += `   📧 Email: ${r.email}\n`;
            text += `   🔑 Password: ${r.password}\n`;
            text += `   ---\n`;
        });
        text += `\n👑 Admin: admin@amethyst.ng / admin123\n`;
        text += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
        
        navigator.clipboard.writeText(text);
        alert('✅ All credentials copied! Now paste into Gmail and send to users.');
    }
    
    function copyEmailsOnly() {
        let emails = importResults.map(r => `${r.fullName} <${r.email}>`).join('\n');
        navigator.clipboard.writeText(emails);
        alert('✅ Email addresses copied!');
    }
    
    function viewFailedEmails() {
        if (!emailResults || emailResults.length === 0) {
            alert('No import results found. Run an import first.');
            return;
        }
        const failed = emailResults.filter(r => !r.success);
        if (failed.length === 0) {
            alert('✅ No failed emails!');
            return;
        }
        let message = '❌ FAILED EMAILS:\n\n';
        failed.forEach(f => {
            message += `${f.name}\n`;
            message += `Email: ${f.email}\n`;
            message += `Password: ${f.password}\n`;
            message += `---\n`;
        });
        alert(message);
    }
    
    function clearAllUsers() {
        if (confirm('⚠️ Delete ALL users except admin?')) {
            const adminOnly = [{
                id: 'admin_001',
                fullName: 'System Administrator',
                email: 'admin@amethyst.ng',
                password: 'admin123',
                role: 'admin',
                status: 'active',
                registrationDate: new Date().toISOString()
            }];
            localStorage.setItem('amethyst_members', JSON.stringify(adminOnly));
            alert('✅ All users cleared! Refresh the page.');
            location.reload();
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Initialize
    displayPreview();
    </script>
</body>
</html><script src="../js/main-nav.js"></script> 
<script src="../js/nav.js"></script> 
<script src="../js/google-sync.js"></script>
